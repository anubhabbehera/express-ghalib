version: 2
updates:
  # Actions in .github/workflows/ are pinned to commit SHAs; this keeps those
  # pins moving forward instead of rotting at whatever was current on the day.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

  # The documentation site's build dependency (marked). Firmware code has no
  # npm dependencies — this covers site/ only.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore

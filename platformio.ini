; express-ghalib — ESP32-S3 PDA
; Board: Waveshare ESP32-S3-RLCD-4.2  (module: ESP32-S3-WROOM-1-N16R8)
;   N16 = 16 MB flash (QIO)  |  R8 = 8 MB Octal (OPI) PSRAM @ 1.8V
; Display: ST7305 reflective LCD, 300x400, 1-bit monochrome, SPI

[env:esp32s3-rlcd]
; pioarduino fork ships Arduino-ESP32 core >= 3.0 (IDF 5.x). The upstream
; platformio "espressif32" has historically lagged core 3.x — swap only if you
; have a known-good upstream version.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ---- Flash: 16 MB QIO ----
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

; ---- PSRAM: 8 MB Octal (OPI). qio_opi = QIO flash + OPI PSRAM ----
board_build.arduino.memory_type = qio_opi

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1      ; Serial over native USB-C
  ; USB-OTG (TinyUSB) instead of the USB-Serial-JTAG peripheral: needed for
  ; the Files app's USB-MSC SD transfer (M10). Serial becomes the TinyUSB CDC;
  ; power.cpp swaps HWCDC::isPlugged() for tud_mounted() under this mode.
  -D ARDUINO_USB_MODE=0
  -D CORE_DEBUG_LEVEL=3
  ; --- LVGL: find our include/lv_conf.h ---
  -D LV_CONF_INCLUDE_SIMPLE
  -D LV_LVGL_H_INCLUDE_SIMPLE    ; generated fonts (src/fonts) include "lvgl.h"
  -I include
  ; --- allocate LVGL / large buffers in PSRAM where possible ---
  -D CONFIG_SPIRAM_USE_MALLOC=1

; Versions are pinned exactly (not ^ranges) so a build is reproducible and an
; upstream release can't land in the firmware unreviewed. These are the versions
; every milestone was hardware-verified against. Bump deliberately.
lib_deps =
  lvgl/lvgl@8.4.0
  h2zero/NimBLE-Arduino@2.5.0        ; central/client role -> HOGP host
  ; MP3 (Helix) decode -> PCM. Pinned to a commit: the repo has no releases, and
  ; this one carries the truncated-input heap-overflow fix that matters for
  ; decoding arbitrary files off the SD card.
  https://github.com/pschatzmann/arduino-libhelix.git#7d0444cac095e2695d63c40ba62b3c40a39ae592
  ; Display: ST7305 has no library — driver lives in src/st7305.{h,cpp}
  ; Audio (add at M4):
  ;   esphome/ES8311@^1.0.0           ; codec I2C config (or hand-rolled)
  ;   esphome/... / schreibfaul1/ESP32-audioI2S  ; MP3/WAV decode -> I2S
  ; RTC (add at M3): a PCF85063 lib, or hand-rolled I2C

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; USB-OTG (TinyUSB CDC) flashing: the 1200 bps "touch" asks the running app to
; reboot into the ROM bootloader (which enumerates as USB-JTAG-Serial), then
; esptool waits for that port. If the app is crashed/asleep, hold BOOT while
; plugging in (or use tools/catch_wake.py) for a manual bootloader entry.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
